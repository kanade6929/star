<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>辰星夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root{
  --night:#05040f;
  --bone:#efe8dc;
  --gold:#e8c98e;
  --gold-dim:rgba(232,201,142,.45);
  --lilac:#b7a6d6;
  --star:#cfe3ff;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --title:"ZCOOL XiaoWei","Noto Serif SC","STKaiti","KaiTi",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);overflow:hidden;color:var(--bone);font-family:var(--serif);-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#000}
#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:none}
#fx{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 95% at 50% 45%,transparent 55%,rgba(3,2,12,.55) 100%)}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.07;mix-blend-mode:overlay}
#fade{position:absolute;inset:0;pointer-events:none;background:#05040f;opacity:0;transition:opacity .5s}
#fade.light{background:#fff3dc}

/* 世界中的交互提示 */
#prompts{position:absolute;inset:0;pointer-events:none}
.prompt{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:clamp(11px,1.15vw,15px);letter-spacing:.08em;color:var(--bone);
  text-shadow:0 0 8px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,1);opacity:0;transition:opacity .35s;display:flex;align-items:center;gap:.5em}
.prompt.on{opacity:1}
.key{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;padding:0 .35em;border:1px solid var(--gold-dim);border-radius:3px;color:var(--gold);font-size:.85em;background:rgba(10,8,26,.55)}

/* 左上：塔罗牌式的进度 */
#hud{position:absolute;left:2.2%;top:3.5%;display:flex;gap:.9em;align-items:flex-start;pointer-events:none;opacity:0;transition:opacity 1.2s}
#hud.on{opacity:1}
.mini{width:clamp(30px,3vw,40px);aspect-ratio:7/12;border:1px solid var(--gold-dim);border-radius:3px;position:relative;
  background:linear-gradient(180deg,rgba(30,24,60,.7),rgba(10,8,26,.7));display:grid;place-items:center;color:var(--gold);font-size:clamp(9px,.8vw,11px)}
.mini::before{content:"";position:absolute;inset:3px;border:1px solid rgba(232,201,142,.18);border-radius:2px}
.mini.have{background:linear-gradient(180deg,#f3ead6,#d9c9a6);color:#6b4f2a;box-shadow:0 0 14px rgba(255,226,160,.5)}
.hudtext{font-size:clamp(11px,1.05vw,14px);line-height:1.9;letter-spacing:.06em;text-shadow:0 0 6px #000}
.hudtext .dim{color:rgba(239,232,220,.5)}
.dots{display:inline-flex;gap:.35em;vertical-align:middle;margin-left:.4em}
.dots i{width:.55em;height:.55em;border-radius:50%;border:1px solid var(--star);opacity:.6}
.dots i.on{background:var(--star);box-shadow:0 0 6px var(--star);opacity:1}

#toast{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font-size:clamp(12px,1.25vw,17px);letter-spacing:.14em;color:var(--bone);
  text-shadow:0 0 10px #000,0 0 3px #000;opacity:0;transition:opacity .6s;pointer-events:none;text-align:center}
#toast.on{opacity:1}
#help{position:absolute;right:2.2%;bottom:3.5%;font-size:clamp(10px,.9vw,12px);color:rgba(239,232,220,.55);letter-spacing:.08em;pointer-events:none;
  line-height:2;text-align:right;transition:opacity 2s;opacity:0}
body.playing #help{opacity:1}
#help .key{font-size:.9em;margin:0 .15em}

/* 章节字幕 */
#chapter{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity 1.6s}
#chapter.on{opacity:1}
#chapter div{text-align:center}
#chapter .num{font-family:var(--serif);font-weight:300;color:var(--gold);font-size:clamp(14px,1.6vw,22px);letter-spacing:.6em;margin-bottom:.6em}
#chapter .name{font-family:var(--title);font-size:clamp(34px,4.6vw,64px);letter-spacing:.3em;text-shadow:0 0 30px rgba(207,227,255,.35)}
#chapter .line{margin-top:1.2em;font-size:clamp(12px,1.2vw,16px);color:rgba(239,232,220,.7);letter-spacing:.25em}

/* 卡牌（结束画面） */
.card{position:relative;height:min(78%,560px);aspect-ratio:7/12;border:1px solid var(--gold-dim);border-radius:6px;
  background:linear-gradient(180deg,rgba(18,14,44,.72),rgba(8,6,22,.82));backdrop-filter:blur(2px);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7% 0 8%;box-shadow:0 0 60px rgba(120,100,200,.18)}
.card::before{content:"";position:absolute;inset:10px;border:1px solid rgba(232,201,142,.2);border-radius:3px;pointer-events:none}
.card .roman{font-family:var(--serif);font-weight:300;color:var(--gold);letter-spacing:.5em;font-size:clamp(14px,1.8vw,22px);padding-left:.5em}
.card h1{margin:0;white-space:nowrap;font-family:var(--title);font-weight:400;writing-mode:vertical-rl;font-size:clamp(46px,7vh,84px);letter-spacing:.35em;
  color:#f6f0e6;text-shadow:0 0 24px rgba(207,227,255,.45),0 0 2px #fff}
.card .sigil{width:34%;aspect-ratio:1}
.card .start{font-size:clamp(12px,1.2vw,15px);letter-spacing:.3em;color:rgba(239,232,220,.8);animation:breath 3.2s ease-in-out infinite}
.card .ctrl{position:absolute;top:calc(100% + 18px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:clamp(10px,.95vw,13px);color:rgba(239,232,220,.55);letter-spacing:.1em}
.card .ctrl .key{margin:0 .25em}
@keyframes breath{0%,100%{opacity:.45}50%{opacity:1}}

#end{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity 2.5s;
  background:radial-gradient(70% 70% at 50% 50%,rgba(40,30,70,.55),rgba(5,4,15,.92))}
#end.on{opacity:1;pointer-events:auto}
#end .card{height:min(70%,480px)}
#end h2{margin:0;white-space:nowrap;font-family:var(--title);font-weight:400;font-size:clamp(22px,3.4vh,36px);letter-spacing:.3em;padding-left:.3em}
#end p{margin:0;font-size:clamp(11px,1.1vw,14px);letter-spacing:.2em;color:rgba(239,232,220,.7);text-align:center;line-height:2}
#end button{font:inherit;font-size:clamp(11px,1.1vw,14px);letter-spacing:.25em;color:var(--gold);background:transparent;border:1px solid var(--gold-dim);
  padding:.6em 1.4em;border-radius:3px;cursor:pointer}
#end .btns{display:flex;flex-direction:column;gap:.8em;align-items:center}
#end button:hover,#end button:focus-visible{background:rgba(232,201,142,.12);outline:none}

#touch{position:absolute;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
#touch button{position:absolute;bottom:5%;width:13%;aspect-ratio:1;max-width:84px;border-radius:50%;border:1px solid rgba(232,201,142,.35);
  background:rgba(10,8,26,.35);color:var(--gold);font:inherit;font-size:14px;pointer-events:auto}
#tl{left:3%}#tr{left:17%}#tj{right:3%}#te{right:17%}

/* ============ 主界面 ============ */
#stage{--u:min(1vh,.5625vw)}
body:not(.playing) #touch{display:none!important}
#menu{position:absolute;inset:0;transition:opacity 1.2s}
#menu.hide{opacity:0;pointer-events:none}
#menu::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(48% 70% at 50% 46%,rgba(5,4,15,.34),rgba(5,4,15,0) 70%),linear-gradient(180deg,rgba(5,4,15,.25),rgba(5,4,15,0) 30%,rgba(5,4,15,0) 70%,rgba(5,4,15,.5))}
.view{position:absolute;inset:0;transition:opacity .9s,visibility .9s}
.view.off{opacity:0;visibility:hidden;pointer-events:none}
.scroll{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;flex-direction:row-reverse;align-items:flex-start}
.brand{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.6)}
.brand .sigil{width:calc(var(--u)*8.5);aspect-ratio:1;animation:spin 200s linear infinite}
.brand h1{margin:0;writing-mode:vertical-rl;font-family:var(--title);font-weight:400;font-size:calc(var(--u)*11.5);letter-spacing:.28em;line-height:1;
  color:#f7f1e7;text-shadow:0 0 calc(var(--u)*3) rgba(207,227,255,.5),0 0 2px rgba(255,255,255,.8)}
.brand h1 span{display:inline-block}
.rule{width:1px;align-self:stretch;margin:calc(var(--u)*1) calc(var(--u)*5) 0;background:linear-gradient(180deg,transparent,var(--gold-dim) 18%,var(--gold-dim) 82%,transparent)}
.vmenu{display:flex;flex-direction:row-reverse;gap:calc(var(--u)*3.4);align-items:flex-start;padding-top:calc(var(--u)*10)}
.vbtn{writing-mode:vertical-rl;font:inherit;font-family:var(--title);font-size:calc(var(--u)*3.4);letter-spacing:.4em;line-height:1;color:rgba(239,232,220,.6);
  background:none;border:0;padding:calc(var(--u)*3.2) calc(var(--u)*1) calc(var(--u)*1);cursor:pointer;position:relative;transition:color .5s,text-shadow .5s;-webkit-tap-highlight-color:transparent}
.vbtn::before{content:"";position:absolute;top:0;left:50%;width:calc(var(--u)*.85);height:calc(var(--u)*.85);background:var(--gold);opacity:0;
  transform:translateX(-50%) rotate(45deg) scale(.3);transition:opacity .5s,transform .6s,box-shadow .6s}
.vbtn:hover,.vbtn:focus{color:#fbf7ee;text-shadow:0 0 calc(var(--u)*2.2) rgba(207,227,255,.6);outline:none}
.vbtn:hover::before,.vbtn:focus::before{opacity:1;transform:translateX(-50%) rotate(45deg) scale(1);box-shadow:0 0 10px 2px rgba(255,226,160,.65)}
.vbtn small{margin-inline-start:.9em;font-family:var(--serif);font-weight:300;font-size:.5em;letter-spacing:.3em;color:var(--gold)}
.vbtn small:empty{display:none}
.wake{position:absolute;left:50%;bottom:calc(var(--u)*11.5);transform:translateX(-50%);margin:0;white-space:nowrap;font-size:calc(var(--u)*1.6);letter-spacing:.3em;
  color:rgba(239,232,220,.7);animation:breath 3.6s ease-in-out infinite;transition:opacity 1.5s}
#menu.awake .wake{opacity:0!important;animation:none}
.foot{position:absolute;left:50%;bottom:calc(var(--u)*5);transform:translateX(-50%);white-space:nowrap;font-size:calc(var(--u)*1.45);color:rgba(239,232,220,.45);letter-spacing:.1em}
.foot .key{margin:0 .25em}
/* 开场：墨色渐显，一字一字 */
#menu.intro .brand .sigil{animation:spin 200s linear infinite,ink 3s ease .1s both}
#menu.intro .brand h1 span{animation:ink 2.6s cubic-bezier(.3,.6,.3,1) both}
#menu.intro .brand h1 span:nth-child(2){animation-delay:.45s}
#menu.intro .brand h1 span:nth-child(3){animation-delay:.9s}
#menu.intro .rule{animation:draw 2.2s ease 1.2s both}
#menu.intro #mainNav .vbtn{animation:ink 1.8s ease both}
#menu.intro #mainNav .vbtn:nth-child(1){animation-delay:1.8s}
#menu.intro #mainNav .vbtn:nth-child(2){animation-delay:2.05s}
#menu.intro #mainNav .vbtn:nth-child(3){animation-delay:2.3s}
#menu.intro .foot{animation:fadein 2s ease 2.8s both}
#menu.intro .wake{animation:fadein 2s ease 2.8s both,breath 3.6s ease-in-out 4.8s infinite}
@keyframes fadein{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}
@keyframes ink{from{opacity:0;filter:blur(6px);transform:translateY(calc(var(--u)*-1))}to{opacity:1;filter:blur(0);transform:none}}
@keyframes draw{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes spin{to{rotate:360deg}}

/* 章节：三张牌 */
.deck{position:absolute;inset:0}
.tcard{--x:0px;--y:calc(var(--u)*6);--r:0deg;position:absolute;left:50%;top:46%;height:calc(var(--u)*56);aspect-ratio:7/12;padding:0;border:0;background:none;
  font:inherit;color:inherit;cursor:pointer;opacity:0;transform:translate(-50%,-50%) translate(var(--x),var(--y)) rotate(var(--r));
  transition:transform .7s cubic-bezier(.2,.75,.25,1),opacity .7s ease;-webkit-tap-highlight-color:transparent}
.deck.dealing .tcard{transition:transform 1.1s cubic-bezier(.2,.75,.25,1) calc(var(--k)*.14s),opacity .9s ease calc(var(--k)*.14s)}
.deck.dealt .tcard{--x:calc(var(--i)*var(--u)*36);--y:calc(var(--a)*var(--u)*2.4);--r:calc(var(--i)*6deg);opacity:1}
.deck.dealt .tcard:hover,.deck.dealt .tcard:focus{--y:calc(var(--a)*var(--u)*2.4 - var(--u)*3.6);--r:calc(var(--i)*2deg);outline:none;z-index:2}
.deck.dealt .tcard.locked:hover,.deck.dealt .tcard.locked:focus{--y:calc(var(--a)*var(--u)*2.4 - var(--u)*1.2);--r:calc(var(--i)*5deg)}
.deck.picking .tcard:not(.chosen){opacity:0}
.deck.dealt.picking .tcard.chosen{--x:0px;--y:calc(var(--u)*-1.5);--r:0deg}
.face{position:absolute;inset:0;border:1px solid var(--gold-dim);border-radius:calc(var(--u)*.8);
  background:linear-gradient(180deg,rgba(24,18,56,.86),rgba(8,6,22,.93));box-shadow:0 0 calc(var(--u)*5) rgba(120,100,200,.16);
  display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*4.4) calc(var(--u)*2.8) calc(var(--u)*3.6);
  transition:border-color .5s,box-shadow .6s;animation:float 9s ease-in-out infinite;animation-delay:calc(var(--k)*-3s)}
.face::before{content:"";position:absolute;inset:calc(var(--u)*1.1);border:1px solid rgba(232,201,142,.18);border-radius:calc(var(--u)*.4);pointer-events:none}
.tcard:hover .face,.tcard:focus .face{border-color:rgba(232,201,142,.85);box-shadow:0 0 calc(var(--u)*6) rgba(170,150,255,.28),0 0 calc(var(--u)*1.4) rgba(255,226,160,.25)}
.tcard.chosen .face{border-color:var(--gold);box-shadow:0 0 calc(var(--u)*9) rgba(255,226,160,.5)}
.face .rn{font-family:var(--serif);font-weight:300;color:var(--gold);letter-spacing:.45em;padding-left:.45em;font-size:calc(var(--u)*2)}
.face .emb{width:56%;aspect-ratio:1;margin-top:auto}
.face .nm{font-family:var(--title);font-size:calc(var(--u)*6.6);line-height:1;letter-spacing:.2em;padding-left:.2em;color:#f7f1e7;margin:calc(var(--u)*2.4) 0 auto;
  text-shadow:0 0 calc(var(--u)*2.4) rgba(207,227,255,.45)}
.face .ln{font-size:calc(var(--u)*1.5);line-height:1.9;letter-spacing:.12em;color:rgba(239,232,220,.66);text-align:center;text-wrap:balance}
.face .st{margin-top:calc(var(--u)*1.4);font-size:calc(var(--u)*1.3);letter-spacing:.3em;padding-left:.3em;color:var(--gold-dim)}
.tcard.done .face .st{color:var(--gold)}
.locked{cursor:default}
.locked .face{background:repeating-linear-gradient(45deg,rgba(232,201,142,.06) 0 1px,transparent 1px calc(var(--u)*1.4)),
  repeating-linear-gradient(-45deg,rgba(232,201,142,.06) 0 1px,transparent 1px calc(var(--u)*1.4)),linear-gradient(180deg,rgba(26,20,52,.9),rgba(9,7,22,.95));justify-content:space-between}
.locked .face .emb{margin:0;width:44%;opacity:.55}
.locked .face .ln{color:rgba(239,232,220,.5)}
.tcard.nudge .face{animation:nudge .5s ease}
.back{position:absolute;left:50%;bottom:calc(var(--u)*5.2);transform:translateX(-50%);font:inherit;font-size:calc(var(--u)*1.7);letter-spacing:.3em;
  color:rgba(239,232,220,.55);background:none;border:0;cursor:pointer;padding:.6em 1.2em;border-radius:3px;transition:color .4s}
.back:hover,.back:focus{color:var(--bone);outline:none}
.back:focus-visible{box-shadow:inset 0 0 0 1px var(--gold-dim)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-.7))}}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(calc(var(--u)*-.6))}75%{transform:translateX(calc(var(--u)*.6))}}

/* 暂停 */
#pause{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(60% 70% at 50% 50%,rgba(5,4,15,.3),rgba(5,4,15,.8));transition:opacity .6s,visibility .6s}
body.paused #chapter,body.paused #prompts,body.paused #toast,body.paused #help{opacity:0!important;transition:opacity .4s}
#pause.off{opacity:0;visibility:hidden;pointer-events:none}
.pwrap{display:flex;flex-direction:column;align-items:center}
.proman{font-family:var(--serif);font-weight:300;color:var(--gold);letter-spacing:.5em;padding-left:.5em;font-size:calc(var(--u)*2.2)}
#pauseNav{padding-top:calc(var(--u)*4)}
#end .card{height:min(70%,480px)}
@media (prefers-reduced-motion:reduce){
  #menu *,#menu *::before{animation:none!important}
  .tcard,.deck.dealing .tcard{transition:opacity .3s!important}
}

</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="prompts"></div>
  <div id="fx"></div>
  <canvas id="grain"></canvas>
  <div id="hud">
    <div class="mini" id="hudcard">XVII</div>
    <div class="hudtext">
      <div><span id="dotlabel">星灯</span><span class="dots" id="dots"></span></div>
      <div id="cardline" class="dim">遗失的牌　未寻得</div>
    </div>
  </div>
  <div id="help"><div><span class="key">A</span><span class="key">D</span> 移动　<span class="key">空格</span> 跳跃　<span class="key">E</span> 互动</div><div>移动鼠标引导光点　<span class="key">M</span> 声音　<span class="key">Esc</span> 暂停</div></div>
  <div id="toast"></div>
  <div id="chapter"><div><div class="num">XVII</div><div class="name">星</div><div class="line">在无光之处，星辰等待被唤醒</div></div></div>
  <div id="touch"><button id="tl">◀</button><button id="tr">▶</button><button id="te">E</button><button id="tj">跳</button></div>
  <div id="fade"></div>
  <div id="end"><div class="card">
    <div class="roman">XVIII</div>
    <h2>月光照见归途</h2>
    <p>第二幕　月　完<br>下一幕　XIX　太阳　尚在远方</p>
    <div class="btns" id="endNav"><button id="again">回到主界面</button><button id="again2">再走月之章</button></div>
  </div></div>
  <div id="menu" class="intro">
    <section class="view" id="vMain">
      <div class="scroll">
        <div class="brand">
          <svg class="sigil" viewBox="0 0 100 100" fill="none" stroke="#e8c98e" stroke-width="1" aria-hidden="true">
            <circle cx="50" cy="50" r="46" opacity=".35"/><circle cx="50" cy="50" r="31" opacity=".22"/>
            <path d="M50 6 L55 45 L94 50 L55 55 L50 94 L45 55 L6 50 L45 45 Z" fill="rgba(232,201,142,.12)"/>
            <path d="M50 26 L52 48 L74 50 L52 52 L50 74 L48 52 L26 50 L48 48 Z" opacity=".6" transform="rotate(45 50 50)"/>
            <circle cx="50" cy="4" r="1.6" fill="#e8c98e" stroke="none"/><circle cx="96" cy="50" r="1.2" fill="#e8c98e" stroke="none" opacity=".6"/>
          </svg>
          <h1 aria-label="辰星夜"><span>辰</span><span>星</span><span>夜</span></h1>
        </div>
        <i class="rule" aria-hidden="true"></i>
        <nav class="vmenu" id="mainNav">
          <button class="vbtn" data-act="start"><span class="lbl">踏入夜色</span><small class="sub"></small></button>
          <button class="vbtn" data-act="chapters"><span class="lbl">章节</span></button>
          <button class="vbtn" data-act="sound" aria-pressed="true"><span class="lbl">琴声</span><small class="snd">开</small></button>
        </nav>
      </div>
      <p class="wake">点击任意处，让琴声响起</p>
      <div class="foot"><span class="key">A</span><span class="key">D</span> 移动　<span class="key">空格</span> 跳跃　<span class="key">E</span> 互动　鼠标 引导光点　<span class="key">Esc</span> 暂停</div>
    </section>
    <section class="view off" id="vChap">
      <div class="deck" id="deck">
        <button class="tcard" data-n="1" style="--i:-1;--a:1;--k:0">
          <span class="face">
            <span class="rn">XVII</span>
            <svg class="emb" viewBox="0 0 100 100" fill="none" stroke="#e8c98e" stroke-width="1" aria-hidden="true">
              <circle cx="50" cy="50" r="40" opacity=".22"/>

  c.fillRect(Math.round(hx - 6.2), Math.round(hy - 2), 13, 3);                   // 刘海盖住眼睛
  c.fillRect(Math.round(hx - 6), Math.round(hy + lag), 3, 4); c.fillRect(Math.round(hx + 3), Math.round(hy + lag * .6), 3, 3); // 两侧
  c.fillStyle = COL.hair3; c.fillRect(Math.round(hx - 6), Math.round(hy + 3 + lag), 2, 1); c.fillRect(Math.round(hx - 2), Math.round(hy + .5), 6, 1);
  c.fillStyle = COL.hair2; c.fillRect(Math.round(hx - 5), Math.round(hy - 5), 2, 3); c.fillRect(Math.round(hx - 6), Math.round(hy + 1 + lag), 1, 2);
  c.fillStyle = COL.hairHi; c.fillRect(Math.round(hx - 1), Math.round(hy - 6), 3, 1); c.fillRect(Math.round(hx + 2), Math.round(hy - 5), 2, 1);

  g.save(); g.translate(Math.round(sx), Math.round(sy));

  g.restore();
}

function traceBeam() {
  const L = M2.lens, ms = M2.mirrors, cr = M2.crystal, gt = M2.gate;

    x += dx; y += dy;

    for (let k = 0; k < ms.length; k++) {
      const m = ms[k]; if (k === last || x !== m.x || y !== m.y) continue;
      const ndx = m.st ? -dy : dy, ndy = m.st ? -dx : dx; dx = ndx; dy = ndy; last = k; pts.push({ x, y }); turned = true; break;

  return { pts, hit };
